<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-5">

    <h1 class="text-4xl font-bold text-blue-600 mb-6">User Information</h1>
    <div id="user-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-7xl">
        <!-- User cards will appear here -->
    </div>

    <script>
        fetch('https://jsonplaceholder.typicode.com/users')
            .then(response => response.json())
            .then(data => showUsername(data));

        function showUsername(data) {
            let list = '';
            data.forEach(user => {
                list += `
                <div class="bg-white rounded-lg shadow-lg p-6 transform hover:scale-105 transition duration-300">
                    <h3 class="text-xl font-semibold text-indigo-600">${user.name}</h3>
                    <p class="text-gray-700 mt-2"><span class="font-bold">Email:</span> ${user.email}</p>
                    <p class="text-gray-700 mt-2"><span class="font-bold">Phone:</span> ${user.phone}</p>
                    <p class="text-gray-700 mt-2">
                        <span class="font-bold">Address:</span><br>
                        Street: ${user.address.street}<br>
                        City: ${user.address.city}<br>
                        Zipcode: ${user.address.zipcode}
                    </p>
                </div>`;
            });
            document.getElementById('user-container').innerHTML = list;
        }
    </script>

</body>
</html>
