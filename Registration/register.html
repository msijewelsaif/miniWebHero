<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Floating card animation */
    .register-card {
      animation: float 1.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500">

  <!-- Registration Card -->
  <div class="w-full max-w-lg p-8 space-y-8 bg-white rounded-xl shadow-lg register-card">
    <div class="text-center">
      <img src="https://via.placeholder.com/80" alt="Logo" class="mx-auto mb-4 rounded-full">
      <h1 class="text-3xl font-bold text-gray-800">Create Your Account</h1>
      <p class="text-sm text-gray-500">Sign up and start your journey with us</p>
    </div>

    <!-- Registration Form -->
    <form id="registrationForm" class="space-y-6">
      <div>
        <label for="fullname" class="block text-sm font-medium text-gray-700">Full Name</label>
        <input
          type="text"
          id="fullname"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition duration-200"
          placeholder="Enter your full name"
        />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input
          type="email"
          id="email"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition duration-200"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          id="password"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition duration-200"
          placeholder="Enter your password"
        />
      </div>
      <div>
        <label for="confirm-password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none transition duration-200"
          placeholder="Re-enter your password"
        />
      </div>
      <button
        type="submit"
        id="registerButton"
        class="w-full px-4 py-2 text-white bg-gradient-to-r from-green-500 to-blue-500 rounded-lg hover:from-green-600 hover:to-blue-600 focus:ring-4 focus:ring-blue-400 focus:ring-opacity-50 transition duration-300 transform hover:scale-105"
      >
        Register
      </button>
    </form>

    <!-- Footer -->
    <p class="text-sm text-center text-gray-500">
      Already have an account? 
      <a href="#" class="text-blue-600 hover:underline">Log in</a>
    </p>
  </div>

  <!-- Script -->
  <script>
    document.getElementById('registrationForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Registration successful!');
    });
  </script>
</body>
</html>
