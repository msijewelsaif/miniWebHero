<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen bg-gray-100">

  <!-- Left Section: Image or Gradient -->
  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-blue-600 to-purple-500 items-center justify-center">
    <div class="text-center text-white px-8">
      <h1 class="text-4xl font-bold">Welcome to Our Platform</h1>
      <p class="mt-4 text-lg">Discover amazing opportunities and connect with a community that inspires growth.</p>
      <img src="https://via.placeholder.com/300" alt="Illustration" class="mt-6 w-2/3 mx-auto">
    </div>
  </div>

  <!-- Right Section: Registration Form -->
  <div class="flex items-center justify-center w-full lg:w-1/2 p-8">
    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold text-center text-gray-800">Create Account</h2>
      <p class="mt-2 text-center text-gray-600">Join us for an amazing experience!</p>

      <!-- Form -->
      <form id="registrationForm" class="mt-8 space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input
            type="text"
            id="name"
            required
            class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="John Doe"
          />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="you@example.com"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input
            type="password"
            id="password"
            required
            class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
            placeholder="Enter a strong password"
          />
        </div>
        <button
          type="submit"
          class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-400 focus:ring-opacity-50 transition duration-300 transform hover:scale-105"
        >
          Register
        </button>
      </form>

      <p class="mt-6 text-sm text-center text-gray-600">
        Already have an account? 
        <a href="#" class="text-blue-500 hover:underline">Sign in</a>
      </p>
    </div>
  </div>

  <!-- Script -->
  <script>
    document.getElementById('registrationForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Registration Successful! Welcome aboard.');
    });
  </script>
</body>
</html>
