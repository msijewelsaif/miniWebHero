<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <header class="bg-white shadow">
    <div class="container mx-auto flex justify-between items-center p-4">
      <h1 class="text-2xl font-bold text-gray-800">BrandName</h1>
      <nav>
        <ul class="flex space-x-4 text-gray-600">
          <li><a href="#" class="hover:text-blue-500">Home</a></li>
          <li><a href="#" class="hover:text-blue-500">About</a></li>
          <li><a href="#" class="hover:text-blue-500">Services</a></li>
          <li><a href="#" class="hover:text-blue-500">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container mx-auto mt-16 px-4">
    <div class="flex flex-wrap lg:flex-nowrap items-center">
      <div class="w-full lg:w-1/2 space-y-4">
        <h2 class="text-4xl font-extrabold text-gray-800 leading-tight">Build Your Future with <span class="text-blue-500">Us</span></h2>
        <p class="text-gray-600 text-lg">Discover new opportunities and achieve your goals with our top-notch services.</p>
        <button class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Get Started</button>
      </div>
      <div class="w-full lg:w-1/2 mt-8 lg:mt-0">
        <img src="https://via.placeholder.com/600x400" alt="Hero Image" class="rounded-lg shadow-lg">
      </div>
    </div>
  </main>
</body>
</html>
