<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body class="bg-gradient bg-primary-subtle">
    <div class="d-flex" id="dashboard-container">
        <!-- Sidebar -->
        <div class="bg-dark p-4 w-25" id="sidebar">
            <h2 class="text-center text-white mb-5">Dashboard</h2>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="#" class="nav-link text-white mb-3">
                        <span class="material-icons">dashboard</span> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white mb-3">
                        <span class="material-icons">analytics</span> Analytics
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white mb-3">
                        <span class="material-icons">settings</span> Settings
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-fill p-4" id="main-content">
            <!-- Header -->
            <header class="d-flex justify-content-between align-items-center bg-primary text-white p-3 mb-4">
                <h1>Welcome, User!</h1>
                <div>
                    <span class="material-icons me-3 cursor-pointer">notifications</span>
                    <span class="material-icons cursor-pointer">account_circle</span>
                </div>
            </header>

            <!-- Cards Section -->
            <section class="row g-4">
                <div class="col-md-4">
                    <div class="card bg-info text-white shadow-lg hover-card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Users</h5>
                            <p class="card-text fs-1">1,230</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-success text-white shadow-lg hover-card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Sales</h5>
                            <p class="card-text fs-1">$8,230</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-warning text-white shadow-lg hover-card">
                        <div class="card-body text-center">
                            <h5 class="card-title">Messages</h5>
                            <p class="card-text fs-1">58</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Footer -->
            <footer class="bg-primary text-white text-center p-3 mt-5">
                &copy; 2024 Dashboard | All Rights Reserved.
            </footer>
        </div>
    </div>

    <!-- Bootstrap JS, Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
