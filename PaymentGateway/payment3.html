<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Payment Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-gray-800 via-black to-gray-900 min-h-screen flex items-center justify-center text-white">

  <div class="w-full max-w-md p-6 bg-gray-800 rounded-lg shadow-xl">
    <!-- Logo and Title -->
    <div class="flex flex-col items-center">
      <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h11M9 21V3m6 8h6m-3-3v6" />
        </svg>
      </div>
      <h1 class="mt-4 text-2xl font-bold text-center">Crypto Payment</h1>
      <p class="mt-2 text-sm text-center text-gray-400">Fast, secure, and decentralized</p>
    </div>

    <!-- Payment Form -->
    <form class="mt-6 space-y-4">
      <!-- Wallet Address -->
      <div>
        <label for="walletAddress" class="block text-sm font-medium text-gray-300">Wallet Address</label>
        <input 
          type="text" 
          id="walletAddress" 
          placeholder="Enter your wallet address" 
          class="w-full px-4 py-2 mt-1 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none"
        />
      </div>

      <!-- Amount -->
      <div>
        <label for="amount" class="block text-sm font-medium text-gray-300">Amount (in BTC)</label>
        <input 
          type="text" 
          id="amount" 
          placeholder="0.00 BTC" 
          class="w-full px-4 py-2 mt-1 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none"
        />
      </div>

      <!-- Payment Method -->
      <div>
        <label for="cryptoType" class="block text-sm font-medium text-gray-300">Cryptocurrency</label>
        <select 
          id="cryptoType" 
          class="w-full px-4 py-2 mt-1 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none"
        >
          <option>Bitcoin (BTC)</option>
          <option>Ethereum (ETH)</option>
          <option>Litecoin (LTC)</option>
          <option>Ripple (XRP)</option>
        </select>
      </div>

      <!-- Transaction Button -->
      <button 
        type="submit" 
        class="w-full py-3 px-4 bg-yellow-500 text-gray-900 font-bold rounded-lg hover:bg-yellow-600 focus:ring-4 focus:ring-yellow-500 focus:ring-opacity-50"
      >
        Proceed to Pay
      </button>
    </form>

    <!-- QR Code (Optional Display) -->
    <div class="mt-6 text-center">
      <p class="text-sm text-gray-400">Scan QR Code to Pay</p>
      <div class="flex items-center justify-center mt-2">
        <div class="w-24 h-24 bg-gray-700 rounded-lg flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8h18M3 16h18M8 3v18m8-18v18" />
          </svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
