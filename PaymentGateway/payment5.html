<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPal Payment Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- Payment Card -->
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-lg">
    <!-- PayPal Branding -->
    <div class="flex justify-center">
      <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal Logo" class="w-16 h-16">
    </div>
    <h1 class="mt-4 text-xl font-bold text-center text-gray-800">Pay with PayPal</h1>
    <p class="mt-2 text-sm text-center text-gray-600">Secure payment through PayPal</p>

    <!-- Payment Form -->
    <form class="mt-6 space-y-4">
      <!-- Email Address -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">PayPal Email</label>
        <input 
          type="email" 
          id="email" 
          placeholder="you@example.com" 
          class="w-full px-4 py-2 mt-1 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required
        />
      </div>

      <!-- Payment Amount -->
      <div>
        <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
        <input 
          type="text" 
          id="amount" 
          placeholder="Enter amount (e.g., $100)" 
          class="w-full px-4 py-2 mt-1 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          required
        />
      </div>

      <!-- Payment Button -->
      <button 
        type="submit" 
        id="payNowButton" 
        class="w-full py-3 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50"
      >
        Pay Now
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-4 text-sm text-center text-gray-600">
      <p>By continuing, you agree to PayPal's <a href="#" class="text-blue-600 hover:underline">Terms and Conditions</a>.</p>
    </div>
  </div>

  <!-- Script for Processing -->
  <script>
    document.getElementById('payNowButton').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Redirecting to PayPal for payment...');
    });
  </script>
</body>
</html>
