<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Banking Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-teal-500 to-blue-600 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm p-6 bg-white rounded-lg shadow-lg">
    <!-- Logo -->
    <div class="flex justify-center">
      <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </div>

    <h1 class="mt-4 text-2xl font-bold text-center text-gray-800">Mobile Banking</h1>
    <p class="mt-2 text-sm text-center text-gray-500">Secure and quick transactions</p>

    <!-- Payment Form -->
    <form class="mt-6 space-y-4">
      <!-- Account Number -->
      <div>
        <label for="accountNumber" class="block text-sm font-medium text-gray-700">Account Number</label>
        <input 
          type="text" 
          id="accountNumber" 
          placeholder="Enter your account number" 
          class="w-full px-4 py-2 mt-1 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"
        />
      </div>

      <!-- Amount -->
      <div>
        <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
        <input 
          type="text" 
          id="amount" 
          placeholder="$0.00" 
          class="w-full px-4 py-2 mt-1 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"
        />
      </div>

      <!-- PIN -->
      <div>
        <label for="pin" class="block text-sm font-medium text-gray-700">Transaction PIN</label>
        <input 
          type="password" 
          id="pin" 
          placeholder="Enter your PIN" 
          class="w-full px-4 py-2 mt-1 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:outline-none"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3 px-4 bg-teal-600 text-white font-bold rounded-lg hover:bg-teal-700 focus:ring-4 focus:ring-teal-500 focus:ring-opacity-50"
      >
        Confirm Payment
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center text-gray-500 text-sm">
      <p>Need help? <a href="#" class="text-teal-600 hover:underline">Contact Support</a></p>
    </div>
  </div>

</body>
</html>
