<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bKash Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-lg">
    <!-- Branding -->
    <div class="flex justify-center">
      <img src="bkash_payment_logo.png" alt="bKash Logo" class="w-20 h-20">
    </div>
    <h1 class="mt-4 text-2xl font-bold text-center text-pink-600">Pay with bKash</h1>
    <p class="mt-2 text-sm text-center text-gray-600">Secure and fast payment through bKash</p>
    
    <!-- Payment Form -->
    <form class="mt-6 space-y-4">
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">bKash Account Number</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="Enter your bKash number" 
          class="w-full px-4 py-2 mt-1 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none" 
          required
        />
      </div>
      <div>
        <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
        <input 
          type="text" 
          id="amount" 
          placeholder="Enter amount (e.g., ৳500)" 
          class="w-full px-4 py-2 mt-1 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:outline-none" 
          required
        />
      </div>
      <button 
        type="submit" 
        class="w-full py-3 bg-pink-600 text-white font-bold rounded-lg hover:bg-pink-700 focus:ring-4 focus:ring-pink-500 focus:ring-opacity-50"
      >
        Pay Now
      </button>
    </form>
    
    <p class="mt-4 text-sm text-center text-gray-600">By proceeding, you agree to <a href="#" class="text-pink-600 hover:underline">bKash terms and conditions</a>.</p>
  </div>
</body>
</html>
