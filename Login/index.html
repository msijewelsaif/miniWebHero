<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Loading animation */
    .spinner {
      border: 4px solid transparent;
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Floating card animation */
    .login-card {
      animation: float 1.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-r from-blue-700 via-purple-600 to-pink-500">

  <!-- Login Card -->
  <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-xl shadow-lg login-card">
    <div class="text-center">
      <img src="https://via.placeholder.com/80" alt="Logo" class="mx-auto mb-4 rounded-full">
      <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
      <p class="text-sm text-gray-500">Login to your account and get started</p>
    </div>
    
    <!-- Login Form -->
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input
          type="email"
          id="email"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-200"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input
          type="password"
          id="password"
          required
          class="w-full px-4 py-2 mt-1 text-gray-800 bg-gray-100 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition duration-200"
          placeholder="Enter your password"
        />
      </div>
      <button
        type="submit"
        id="loginButton"
        class="flex items-center justify-center w-full px-4 py-2 text-white bg-gradient-to-r from-blue-500 to-purple-500 rounded-lg hover:from-blue-600 hover:to-purple-600 focus:ring-4 focus:ring-purple-400 focus:ring-opacity-50 transition duration-300 transform hover:scale-105"
      >
        <span class="mr-2" id="buttonText">Login</span>
        <div class="hidden spinner" id="spinner"></div>
      </button>
    </form>
    
    <!-- Footer -->
    <p class="text-sm text-center text-gray-500">
      Don’t have an account? 
      <a href="#" class="text-purple-600 hover:underline">Sign up</a>
    </p>
  </div>

  <!-- Script for Loading Animation -->
  <script>
    const loginButton = document.getElementById('loginButton');
    const buttonText = document.getElementById('buttonText');
    const spinner = document.getElementById('spinner');

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      buttonText.textContent = 'Logging in...';
      spinner.classList.remove('hidden');
      
      setTimeout(() => {
        // Simulate successful login (replace with actual logic)
        buttonText.textContent = 'Login';
        spinner.classList.add('hidden');
        alert('Login Successful!');
      }, 3000);
    });
  </script>
</body>
</html>
