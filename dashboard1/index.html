<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-r from-purple-700 to-indigo-800 text-white h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-purple-900 shadow-lg">
        <div class="p-6 text-center">
            <h2 class="text-2xl font-bold">Dashboard</h2>
        </div>
        <nav class="mt-10 space-y-6">
            <a href="#" class="flex items-center space-x-3 px-6 py-2 hover:bg-purple-800">
                <span class="material-icons">dashboard</span>
                <span>Overview</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-6 py-2 hover:bg-purple-800">
                <span class="material-icons">analytics</span>
                <span>Analytics</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-6 py-2 hover:bg-purple-800">
                <span class="material-icons">settings</span>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
        <header class="flex justify-between items-center bg-purple-800 p-4 shadow-lg">
            <h1 class="text-xl font-bold">Welcome, User!</h1>
            <div class="flex items-center space-x-3">
                <button class="hover:bg-purple-700 p-2 rounded-full">
                    <span class="material-icons">notifications</span>
                </button>
                <button class="hover:bg-purple-700 p-2 rounded-full">
                    <span class="material-icons">account_circle</span>
                </button>
            </div>
        </header>
        <section class="flex-1 p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Cards -->
                <div class="bg-purple-700 rounded-lg p-6 shadow-lg text-center">
                    <h2 class="text-xl font-semibold">Users</h2>
                    <p class="text-4xl font-bold mt-3">1,230</p>
                    <button class="bg-white text-purple-700 font-semibold px-4 py-2 rounded mt-4 hover:bg-gray-200">
                        View Users
                    </button>
                </div>
                <div class="bg-indigo-700 rounded-lg p-6 shadow-lg text-center">
                    <h2 class="text-xl font-semibold">Sales</h2>
                    <p class="text-4xl font-bold mt-3">$8,230</p>
                    <button class="bg-white text-indigo-700 font-semibold px-4 py-2 rounded mt-4 hover:bg-gray-200">
                        View Sales
                    </button>
                </div>
                <div class="bg-pink-700 rounded-lg p-6 shadow-lg text-center">
                    <h2 class="text-xl font-semibold">Messages</h2>
                    <p class="text-4xl font-bold mt-3">58</p>
                    <button class="bg-white text-pink-700 font-semibold px-4 py-2 rounded mt-4 hover:bg-gray-200">
                        View Messages
                    </button>
                </div>
            </div>
        </section>
        <footer class="bg-purple-800 p-4 text-center text-sm">
            &copy; 2024 Dashboard | All Rights Reserved.
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
