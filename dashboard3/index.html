<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2 class="sidebar-title">Dashboard</h2>
            <ul class="nav">
                <li><a href="#" class="nav-link"><span class="material-icons">dashboard</span> Overview</a></li>
                <li><a href="#" class="nav-link"><span class="material-icons">analytics</span> Analytics</a></li>
                <li><a href="#" class="nav-link"><span class="material-icons">settings</span> Settings</a></li>
                <li><a href="#" class="nav-link logout-link"><span class="material-icons">logout</span> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <h1>Welcome, User!</h1>
                <div class="header-buttons">
                    <button class="header-btn">Refresh</button>
                    <button class="header-btn">Settings</button>
                    <span class="material-icons">notifications</span>
                    <span class="material-icons">account_circle</span>
                </div>
            </header>

            <!-- Cards Section -->
            <section class="cards">
                <div class="card card-info">
                    <h5>Users</h5>
                    <p>1,230</p>
                </div>
                <div class="card card-success">
                    <h5>Sales</h5>
                    <p>$8,230</p>
                </div>
                <div class="card card-warning">
                    <h5>Messages</h5>
                    <p>58</p>
                </div>
            </section>

            <!-- Footer -->
            <footer class="footer">
                &copy; 2024 Dashboard | All Rights Reserved.
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
